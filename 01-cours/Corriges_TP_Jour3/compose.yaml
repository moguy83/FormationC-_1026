services:
  db:
    image: postgres:16
    environment:
      # Identifiants réservés à cette base locale de TP ; ne jamais les réutiliser en production.
      POSTGRES_USER: formation
      POSTGRES_PASSWORD: formation_test
      POSTGRES_DB: bibliotheque_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formation -d bibliotheque_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Pas de volume permanent : base éphémère de test.
